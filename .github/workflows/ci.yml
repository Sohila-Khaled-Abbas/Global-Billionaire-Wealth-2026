name: CI & Data Integrity Verification

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-data-and-model:
    name: Validate Data Integrity & Semantic Model
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 🧪 Execute Data & Semantic Model Audit
        run: python scripts/validate_data.py

      - name: 📊 Confirm PBIP & TMDL Integrity
        run: |
          test -f powerbi/Global_Billionaire_Wealth_2026.pbip
          test -f powerbi/Global_Billionaire_Wealth_2026.Report/definition.pbir
          test -f powerbi/Global_Billionaire_Wealth_2026.SemanticModel/definition.pbism
          test -f powerbi/Global_Billionaire_Wealth_2026.SemanticModel/definition/model.tmdl
          test -f powerbi/Global_Billionaire_Wealth_2026.SemanticModel/definition/relationships.tmdl
          echo "Power BI Developer Mode files verified."
